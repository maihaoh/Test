<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo 实时预测 & 胜率监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --green-color: #10b981;
            --red-color: #ef4444;
            --purple-color: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; }

        .time-badge {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card-title { color: #94a3b8; font-size: 0.85rem; margin-bottom: 8px; }
        .card-value { font-size: 1.6rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; font-weight: 500; }

        .tag-big { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-small { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-win { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .tag-loss { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; padding: 3px 8px; border-radius: 6px; font-weight: bold; }

        .icon-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .bg-green { background-color: var(--green-color); }
        .bg-red { background-color: var(--red-color); }
        .bg-red-purple { background: linear-gradient(135deg, var(--red-color) 50%, var(--purple-color) 50%); }
        .bg-green-purple { background: linear-gradient(135deg, var(--green-color) 50%, var(--purple-color) 50%); }

        .predict-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); }
        .win-rate-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🎯 WinGo 预测胜率 Dashboard</h1>
                <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Cloudflare 节点加密直连 | 每 5 秒自动更新</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="time-badge">🇲🇾 <span id="myt-clock">--:--:--</span> MYT</div>
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    <span id="countdown">5s</span>
                </div>
            </div>
        </header>

        <div class="grid-cards">
            <div class="card">
                <div class="card-title">最新期号</div>
                <div class="card-value" id="latest-issue">----</div>
            </div>
            <div class="card">
                <div class="card-title">最新开奖</div>
                <div class="card-value" id="latest-result">--</div>
            </div>
            <div class="card predict-box">
                <div class="card-title" style="color: #60a5fa;">🔮 下期预测</div>
                <div class="card-value" id="predicted-result">--</div>
            </div>
            <div class="card win-rate-box">
                <div class="card-title" style="color: #34d399;">📊 近 20 期胜率</div>
                <div class="card-value" style="color: #34d399;" id="win-rate">-- %</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <h3>📜 近期预测 VS 实际开奖 (自动对账)</h3>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>期号</th>
                                <th>实际开奖</th>
                                <th>系统预测</th>
                                <th>结果</th>
                            </tr>
                        </thead>
                        <tbody id="draw-table">
                            <tr><td colspan="4">数据加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h3>📈 走势图</h3>
                <canvas id="chart-numbers" style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 已自动将你的专属 Cloudflare Worker 域名接入
        const WORKER_URL = "https://rapid-disk-cfwingo-api.j05stm24f008.workers.dev";

        let myChart = null;
        let countdownVal = 5;

        function updateMYTClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('myt-clock').innerText = new Intl.DateTimeFormat('en-GB', options).format(now);
        }
        setInterval(updateMYTClock, 1000);

        function md5(string) {
            function RotateLeft(lValue, iShiftBits) { return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits)); }
            function AddUnsigned(lX, lY) {
                var lX4, lY4, lX8, lY8, lResult;
                lX8 = (lX & 0x80000000); lY8 = (lY & 0x80000000);
                lX4 = (lX & 0x40000000); lY4 = (lY & 0x40000000);
                lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
                if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
                if (lX4 | lY4) {
                    if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
                    else return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
                } else return (lResult ^ lX8 ^ lY8);
            }
            function F(x, y, z) { return (x & y) | ((~x) & z); }
            function G(x, y, z) { return (x & z) | (y & (~z)); }
            function H(x, y, z) { return (x ^ y ^ z); }
            function I(x, y, z) { return (y ^ (x | (~z))); }
            function FF(a, b, c, d, x, s, ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(F(b, c, d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); };
            function GG(a, b, c, d, x, s, ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(G(b, c, d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); };
            function HH(a, b, c, d, x, s, ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(H(b, c, d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); };
            function II(a, b, c, d, x, s, ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(I(b, c, d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); };
            function ConvertToWordArray(string) {
                var lWordCount, lMessageLength = string.length, lNumberOfWords_temp1 = lMessageLength + 8,
                    lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64,
                    lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16, lWordArray = Array(lNumberOfWords - 1), lBytePosition = 0, lByteCount = 0;
                while (lByteCount < lMessageLength) {
                    lWordCount = (lByteCount - (lByteCount % 4)) / 4;
                    lBytePosition = (lByteCount % 4) * 8;
                    lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
                    lByteCount++;
                }
                lWordCount = (lByteCount - (lByteCount % 4)) / 4;
                lBytePosition = (lByteCount % 4) * 8;
                lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
                lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
                lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
                return lWordArray;
            };
            function WordToHex(lValue) {
                var WordToHexValue = "", WordToHexValue_temp = "", lByte, lCount;
                for (lCount = 0; lCount <= 3; lCount++) {
                    lByte = (lValue >>> (lCount * 8)) & 255;
                    WordToHexValue_temp = "0" + lByte.toString(16);
                    WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length - 2, 2);
                }
                return WordToHexValue;
            };
            var x = Array(), k, AA, BB, CC, DD, a, b, c, d,
                S11 = 7, S12 = 12, S13 = 17, S14 = 22, S21 = 5, S22 = 9, S23 = 14, S24 = 20,
                S31 = 4, S32 = 11, S33 = 16, S34 = 23, S41 = 6, S42 = 10, S43 = 15, S44 = 21;
            string = unescape(encodeURIComponent(string));
            x = ConvertToWordArray(string);
            a = 0x67452301; b = 0xEFCDAB89; c = 0x98BADCFE; d = 0x10325476;
            for (k = 0; k < x.length; k += 16) {
                AA = a; BB = b; CC = c; DD = d;
                a = FF(a, b, c, d, x[k + 0], S11, 0xD76AA478); d = FF(d, a, b, c, x[k + 1], S12, 0xE8C7B756); c = FF(c, d, a, b, x[k + 2], S13, 0x242070DB); b = FF(b, c, d, a, x[k + 3], S14, 0xC1BDCEEE);
                a = FF(a, b, c, d, x[k + 4], S11, 0xF57C0FAF); d = FF(d, a, b, c, x[k + 5], S12, 0x4787C62A); c = FF(c, d, a, b, x[k + 6], S13, 0xA8304613); b = FF(b, c, d, a, x[k + 7], S14, 0xFD469501);
                a = FF(a, b, c, d, x[k + 8], S11, 0x698098D8); d = FF(d, a, b, c, x[k + 9], S12, 0x8B44F7AF); c = FF(c, d, a, b, x[k + 10], S13, 0xFFFF5BB1); b = FF(b, c, d, a, x[k + 11], S14, 0x895CD7BE);
                a = FF(a, b, c, d, x[k + 12], S11, 0x6B901122); d = FF(d, a, b, c, x[k + 13], S12, 0xFD987193); c = FF(c, d, a, b, x[k + 14], S13, 0xA679438E); b = FF(b, c, d, a, x[k + 15], S14, 0x49B40821);
                a = GG(a, b, c, d, x[k + 1], S21, 0xF61E2562); d = GG(d, a, b, c, x[k + 6], S22, 0xC040B340); c = GG(c, d, a, b, x[k + 11], S23, 0x265E5A51); b = GG(b, c, d, a, x[k + 0], S24, 0xE9B6C7AA);
                a = GG(a, b, c, d, x[k + 5], S21, 0xD62F105D); d = GG(d, a, b, c, x[k + 10], S22, 0x2441453); c = GG(c, d, a, b, x[k + 15], S23, 0xD8A1E681); b = GG(b, c, d, a, x[k + 4], S24, 0xE7D3FBC8);
                a = GG(a, b, c, d, x[k + 9], S21, 0x21E1CDE6); d = GG(d, a, b, c, x[k + 14], S22, 0xC33707D6); c = GG(c, d, a, b, x[k + 3], S23, 0xF4D50D87); b = GG(b, c, d, a, x[k + 8], S24, 0x455A14ED);
                a = GG(a, b, c, d, x[k + 13], S21, 0xA9E3E905); d = GG(d, a, b, c, x[k + 2], S22, 0xFCEFA3F8); c = GG(c, d, a, b, x[k + 7], S23, 0x676F02D9); b = GG(b, c, d, a, x[k + 12], S24, 0x8D2A4C8A);
                a = HH(a, b, c, d, x[k + 5], S31, 0xFFFA3942); d = HH(d, a, b, c, x[k + 8], S32, 0x8771F681); c = HH(c, d, a, b, x[k + 11], S33, 0x6D9D6122); b = HH(b, c, d, a, x[k + 14], S34, 0xFDE5380C);
                a = HH(a, b, c, d, x[k + 1], S31, 0xA4BEEA44); d = HH(d, a, b, c, x[k + 4], S32, 0x4BDECFA9); c = HH(c, d, a, b, x[k + 7], S33, 0xF6BB4B60); b = HH(b, c, d, a, x[k + 10], S34, 0xBEBFBC70);
                a = HH(a, b, c, d, x[k + 13], S31, 0x289B7EC6); d = HH(d, a, b, c, x[k + 0], S32, 0xEAA127FA); c = HH(c, d, a, b, x[k + 3], S33, 0xD4EF3085); b = HH(b, c, d, a, x[k + 6], S34, 0x4881D05);
                a = HH(a, b, c, d, x[k + 9], S31, 0xD9D4D039); d = HH(d, a, b, c, x[k + 12], S32, 0xE6DB99E5); c = HH(c, d, a, b, x[k + 15], S33, 0x1FA27CF8); b = HH(b, c, d, a, x[k + 2], S34, 0xC4AC5665);
                a = II(a, b, c, d, x[k + 0], S41, 0xF4292244); d = II(d, a, b, c, x[k + 7], S42, 0x432AFF97); c = II(c, d, a, b, x[k + 14], S43, 0xAB9423A7); b = II(b, c, d, a, x[k + 5], S44, 0xFC93A039);
                a = II(a, b, c, d, x[k + 12], S41, 0x655B59C3); d = II(d, a, b, c, x[k + 3], S42, 0x8F0CCC92); c = II(c, d, a, b, x[k + 10], S43, 0xFFEFF47D); b = II(b, c, d, a, x[k + 1], S44, 0x85845DD1);
                a = AddUnsigned(a, AA); b = AddUnsigned(b, BB); c = AddUnsigned(c, CC); d = AddUnsigned(d, DD);
            }
            return (WordToHex(a) + WordToHex(b) + WordToHex(c) + WordToHex(d)).toUpperCase();
        }

        function getNumberIconHtml(num) {
            num = parseInt(num);
            let colorClass = '';
            if (num === 0) colorClass = 'bg-red-purple';
            else if (num === 5) colorClass = 'bg-green-purple';
            else if ([1, 3, 7, 9].includes(num)) colorClass = 'bg-green';
            else if ([2, 4, 6, 8].includes(num)) colorClass = 'bg-red';
            return `<span class="icon-num ${colorClass}">${num}</span>`;
        }

        function getPredictionForDraw(historyDraws) {
            if (!historyDraws || historyDraws.length < 3) return { num: 5, size: '大' };
            const recent = historyDraws.slice(0, 5).map(d => d.number);
            const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
            const predictedSize = avg < 4.5 ? '大' : '小';
            const predictedNum = predictedSize === '大' ? Math.floor(avg + 2) % 10 : Math.floor(avg) % 5;
            return { num: predictedNum, size: predictedSize };
        }

        async function fetchDraws() {
            const random = Array.from({length: 32}, () => Math.floor(Math.random() * 16).toString(16)).join('');
            const payload = { "pageSize": 30, "pageNo": 1, "typeId": 30, "language": 0, "random": random };
            const jsonStr = JSON.stringify({ "language": 0, "pageNo": 1, "pageSize": 30, "random": random, "typeId": 30 });
            payload.signature = md5(jsonStr);
            payload.timestamp = Math.floor(Date.now() / 1000);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await response.json();
                if (json.code === 0 && json.data && json.data.list) {
                    return json.data.list.map(item => {
                        const num = parseInt(item.number);
                        return {
                            issueNumber: String(item.issueNumber),
                            number: num,
                            size: num >= 5 ? '大' : '小',
                            colour: item.colour
                        };
                    });
                }
            } catch (e) {
                console.error("Worker 数据接收失败", e);
            }
            return [];
        }

        async function refreshDashboard() {
            const draws = await fetchDraws();
            if (!draws || draws.length === 0) return;

            const latest = draws[0];
            document.getElementById('latest-issue').innerText = latest.issueNumber.slice(-4);
            document.getElementById('latest-result').innerHTML = `
                ${getNumberIconHtml(latest.number)} 
                <span class="${latest.size === '大' ? 'tag-big' : 'tag-small'}">${latest.size}</span>
            `;

            const nextPrediction = getPredictionForDraw(draws);
            document.getElementById('predicted-result').innerHTML = `
                ${getNumberIconHtml(nextPrediction.num)}
                <span class="${nextPrediction.size === '大' ? 'tag-big' : 'tag-small'}">${nextPrediction.size}</span>
            `;

            let winCount = 0;
            let totalChecked = 0;
            let tableHtml = '';

            for (let i = 0; i < draws.length - 1; i++) {
                const currentDraw = draws[i];
                const historySlice = draws.slice(i + 1);
                const prediction = getPredictionForDraw(historySlice);
                const isWin = currentDraw.size === prediction.size;

                if (i < 20) {
                    totalChecked++;
                    if (isWin) winCount++;
                }

                tableHtml += `
                    <tr>
                        <td>${currentDraw.issueNumber.slice(-4)}期</td>
                        <td>
                            ${getNumberIconHtml(currentDraw.number)}
                            <span class="${currentDraw.size === '大' ? 'tag-big' : 'tag-small'}">${currentDraw.size}</span>
                        </td>
                        <td>
                            ${getNumberIconHtml(prediction.num)}
                            <span class="${prediction.size === '大' ? 'tag-big' : 'tag-small'}">${prediction.size}</span>
                        </td>
                        <td>
                            ${isWin ? '<span class="tag-win">✅ 赢</span>' : '<span class="tag-loss">❌ 输</span>'}
                        </td>
                    </tr>
                `;
            }

            const winRate = totalChecked > 0 ? Math.round((winCount / totalChecked) * 100) : 0;
            document.getElementById('win-rate').innerText = `${winRate}% (${winCount}赢 / ${totalChecked - winCount}输)`;
            document.getElementById('draw-table').innerHTML = tableHtml;

            const recentDraws = [...draws.slice(0, 10)].reverse();
            if (myChart) myChart.destroy();
            const ctx = document.getElementById('chart-numbers').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: recentDraws.map(d => d.issueNumber.slice(-3)),
                    datasets: [{
                        label: '开奖号码',
                        data: recentDraws.map(d => d.number),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { min: 0, max: 9, grid: { color: '#334155' } }, x: { grid: { color: '#334155' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        setInterval(() => {
            countdownVal--;
            if (countdownVal <= 0) {
                countdownVal = 5;
                refreshDashboard();
            }
            document.getElementById('countdown').innerText = `${countdownVal}s`;
        }, 1000);

        refreshDashboard();
    </script>
</body>
</html>
