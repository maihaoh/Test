<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo & 百家乐 实时预测Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --green-color: #10b981;
            --red-color: #ef4444;
            --purple-color: #8b5cf6;
            --blue-color: #3b82f6;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            background: var(--card-bg);
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* D51 - D58 房间选择器样式 */
        .room-bar {
            display: none;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 20px;
            align-items: center;
            gap: 12px;
        }

        .room-select {
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .time-badge {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card-title { color: #94a3b8; font-size: 0.85rem; margin-bottom: 8px; }
        .card-value { font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; font-weight: 500; }

        .tag-big { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .tag-small { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .tag-win { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .tag-loss { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; padding: 3px 8px; border-radius: 6px; font-weight: bold; }

        /* 百家乐 专属样式 */
        .tag-zhuang { background: #dc2626; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
        .tag-xian { background: #2563eb; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
        .tag-he { background: #16a34a; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }

        .icon-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .bg-green { background-color: var(--green-color); }
        .bg-red { background-color: var(--red-color); }
        .bg-red-purple { background: linear-gradient(135deg, var(--red-color) 50%, var(--purple-color) 50%); }
        .bg-green-purple { background: linear-gradient(135deg, var(--green-color) 50%, var(--purple-color) 50%); }

        .predict-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); }
        .win-rate-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 id="page-title">🎯 WinGo 预测胜率 Dashboard</h1>
                <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Cloudflare 节点加密直连 | 每 5 秒自动更新</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="time-badge">🇲🇾 <span id="myt-clock">--:--:--</span> MYT</div>
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    <span id="countdown">5s</span>
                </div>
            </div>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" id="btn-wingo" onclick="switchGameMode('wingo')">🎰 WinGo 模式</button>
            <button class="mode-btn" id="btn-baccarat" onclick="switchGameMode('baccarat')">🃏 百家乐 Choice</button>
        </div>

        <!-- D51 到 D58 房间选择框 -->
        <div class="room-bar" id="baccarat-room-bar">
            <span>🏠 <b>选择房间：</b></span>
            <select class="room-select" id="room-select" onchange="changeBaccaratRoom()">
                <option value="D51">D51 房间</option>
                <option value="D52">D52 房间</option>
                <option value="D53">D53 房间</option>
                <option value="D54">D54 房间</option>
                <option value="D55">D55 房间</option>
                <option value="D56">D56 房间</option>
                <option value="D57">D57 房间</option>
                <option value="D58">D58 房间</option>
            </select>
            <span style="font-size: 0.85rem; color: #94a3b8; margin-left: 10px;">当前正在实时监控此房间</span>
        </div>

        <div class="grid-cards">
            <div class="card">
                <div class="card-title" id="card-label-issue">最新期号</div>
                <div class="card-value" id="latest-issue">----</div>
            </div>
            <div class="card">
                <div class="card-title">最新开奖</div>
                <div class="card-value" id="latest-result">--</div>
            </div>
            <div class="card predict-box">
                <div class="card-title" style="color: #60a5fa;">🔮 下期预测</div>
                <div class="card-value" id="predicted-result">--</div>
            </div>
            <div class="card win-rate-box">
                <div class="card-title" style="color: #34d399;">📊 近 20 期胜率</div>
                <div class="card-value" style="color: #34d399;" id="win-rate">-- %</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <h3>📜 近期预测 VS 实际开奖 (自动对账)</h3>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th id="th-issue">期号</th>
                                <th>实际开奖</th>
                                <th>系统预测</th>
                                <th>结果</th>
                            </tr>
                        </thead>
                        <tbody id="draw-table">
                            <tr><td colspan="4">数据加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h3 id="chart-title">📈 走势图</h3>
                <canvas id="chart-numbers" style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        <script>

const DATA_URL = "./data.json";

let currentMode = "wingo";
let currentRoom = "D51";

let myChart = null;

let countdownVal = 5;


// ============================================================
// MYT CLOCK
// ============================================================

function updateMYTClock() {

    const now = new Date();

    const options = {

        timeZone:
            "Asia/Kuala_Lumpur",

        hour:
            "2-digit",

        minute:
            "2-digit",

        second:
            "2-digit",

        hour12:
            false
    };

    document.getElementById(
        "myt-clock"
    ).innerText =
        new Intl.DateTimeFormat(
            "en-GB",
            options
        ).format(now);
}

setInterval(
    updateMYTClock,
    1000
);

updateMYTClock();


// ============================================================
// TAG
// ============================================================

function getBaccaratTag(type) {

    if (type === "庄") {

        return `
            <span class="tag-zhuang">
                庄
            </span>
        `;
    }

    if (type === "闲") {

        return `
            <span class="tag-xian">
                闲
            </span>
        `;
    }

    if (type === "和") {

        return `
            <span class="tag-he">
                和
            </span>
        `;
    }

    return `<span>${type}</span>`;
}


// ============================================================
// WinGo 数字
// ============================================================

function getNumberIconHtml(num) {

    num = parseInt(num);

    let colorClass = "";

    if (num === 0) {

        colorClass =
            "bg-red-purple";

    } else if (num === 5) {

        colorClass =
            "bg-green-purple";

    } else if (
        [1, 3, 7, 9].includes(num)
    ) {

        colorClass =
            "bg-green";

    } else if (
        [2, 4, 6, 8].includes(num)
    ) {

        colorClass =
            "bg-red";
    }

    return `
        <span class="icon-num ${colorClass}">
            ${num}
        </span>
    `;
}


// ============================================================
// ============================================================
// 4指标 WinGo 预测算法
// ============================================================
// ============================================================

function predictNextNumber(draws) {

    if (
        !draws ||
        draws.length < 10
    ) {

        return {

            num: 5,

            size: "大",

            signal: "观望",

            confidence: "低",

            bigScore: 0,

            smallScore: 0,

            difference: 0,

            markovNum: 5,

            markovSize: "大",

            meanSize: "平",

            streak: 0,

            special: false
        };
    }


    const nums =
        draws.map(
            d => Number(d.number)
        );


    const sizes =
        draws.map(
            d => d.size
        );


    const lastNum =
        nums[0];


    const lastSize =
        sizes[0];


    // ========================================================
    // 1. 长龙
    // ========================================================

    let streakCnt = 0;

    for (
        let s of sizes
    ) {

        if (
            s === lastSize
        ) {

            streakCnt++;

        } else {

            break;
        }
    }


    // ========================================================
    // 2. 马尔可夫转移
    // ========================================================

    const transitionCounts =
        Array(10).fill(0);


    for (
        let i = 0;
        i < nums.length - 1;
        i++
    ) {

        const currentNum =
            nums[i];


        const previousNum =
            nums[i + 1];


        if (
            previousNum === lastNum
        ) {

            if (
                Number.isInteger(
                    currentNum
                ) &&
                currentNum >= 0 &&
                currentNum <= 9
            ) {

                transitionCounts[
                    currentNum
                ]++;
            }
        }
    }


    const maxTransition =
        Math.max(
            ...transitionCounts
        );


    let markovBestNum = 5;


    if (
        maxTransition > 0
    ) {

        markovBestNum =
            transitionCounts.indexOf(
                maxTransition
            );
    }


    const markovSize =
        markovBestNum >= 5
            ? "大"
            : "小";


    // ========================================================
    // 3. 近10期均值回归
    // ========================================================

    const recent10 =
        nums.slice(
            0,
            10
        );


    const bigCount =
        recent10.filter(
            n => n >= 5
        ).length;


    let meanSize = "平";


    if (
        bigCount >= 7
    ) {

        meanSize = "小";

    } else if (
        bigCount <= 3
    ) {

        meanSize = "大";
    }


    // ========================================================
    // 4. 0 / 5 特殊号
    // ========================================================

    const isSpecialNum =
        lastNum === 0 ||
        lastNum === 5;


    // ========================================================
    // 综合评分
    // ========================================================

    let bigScore = 0;

    let smallScore = 0;


    // 马尔可夫
    if (
        markovSize === "大"
    ) {

        bigScore += 1.5;

    } else {

        smallScore += 1.5;
    }


    // 均值回归
    if (
        meanSize === "大"
    ) {

        bigScore += 1;

    } else if (
        meanSize === "小"
    ) {

        smallScore += 1;
    }


    // 长龙
    if (
        streakCnt >= 3
    ) {

        if (
            lastSize === "大"
        ) {

            bigScore += 1.2;

        } else {

            smallScore += 1.2;
        }
    }


    const difference =
        Math.abs(
            bigScore -
            smallScore
        );


    // ========================================================
    // 最终方向
    // ========================================================

    let finalSize =
        bigScore >= smallScore
            ? "大"
            : "小";


    let signal = "观望";

    let confidence = "普通";


    // 指标冲突
    if (
        difference < 0.8
    ) {

        signal =
            "观望";

        confidence =
            "避险观望";


    // 0 / 5
    } else if (
        isSpecialNum
    ) {

        signal =
            "观望";

        confidence =
            "避险观望";


    // 大
    } else if (
        bigScore > smallScore
    ) {

        finalSize =
            "大";

        signal =
            "BUY";

        confidence =
            bigScore >= 2.5
                ? "🔥高确信"
                : "普通";


    // 小
    } else {

        finalSize =
            "小";

        signal =
            "SELL";

        confidence =
            smallScore >= 2.5
                ? "🔥高确信"
                : "普通";
    }


    // ========================================================
    // 具体数字
    // ========================================================

    let targetNum =
        finalSize === "大"
            ? 7
            : 2;


    let maxNumScore = -1;


    const startNum =
        finalSize === "大"
            ? 5
            : 0;


    const endNum =
        finalSize === "大"
            ? 10
            : 5;


    for (
        let i = startNum;
        i < endNum;
        i++
    ) {

        if (
            transitionCounts[i]
            > maxNumScore
        ) {

            maxNumScore =
                transitionCounts[i];

            targetNum =
                i;
        }
    }


    // 没有历史转移
    if (
        maxTransition === 0
    ) {

        targetNum =
            finalSize === "大"
                ? 7
                : 2;
    }


    return {

        num:
            targetNum,

        size:
            finalSize,

        signal:
            signal,

        confidence:
            confidence,

        bigScore:
            Number(
                bigScore.toFixed(2)
            ),

        smallScore:
            Number(
                smallScore.toFixed(2)
            ),

        difference:
            Number(
                difference.toFixed(2)
            ),

        markovNum:
            markovBestNum,

        markovSize:
            markovSize,

        meanSize:
            meanSize,

        streak:
            streakCnt,

        special:
            isSpecialNum
    };
}


// ============================================================
// 从 data.json 读取
// ============================================================

async function loadData() {

    try {

        const response =
            await fetch(
                DATA_URL +
                "?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "data.json HTTP " +
                response.status
            );
        }


        return await response.json();

    } catch (error) {

        console.error(
            "读取 data.json 失败:",
            error
        );

        return null;
    }
}


// ============================================================
// WinGo Dashboard
// ============================================================

async function refreshDashboard() {

    if (
        currentMode !==
        "wingo"
    ) {

        return;
    }


    const data =
        await loadData();


    if (
        !data ||
        !data.wingo
    ) {

        return;
    }


    const draws =
        data.wingo.draws ||
        [];


    if (
        draws.length === 0
    ) {

        return;
    }


    const latest =
        draws[0];


    // ========================================================
    // 最新期号
    // ========================================================

    document.getElementById(
        "latest-issue"
    ).innerText =
        String(
            latest.issueNumber
        ).slice(-4);


    // ========================================================
    // 最新开奖
    // ========================================================

    document.getElementById(
        "latest-result"
    ).innerHTML = `

        ${getNumberIconHtml(
            latest.number
        )}

        <span class="${
            latest.size === "大"
                ? "tag-big"
                : "tag-small"
        }">

            ${latest.size}

        </span>
    `;


    // ========================================================
    // 预测
    // ========================================================

    const prediction =
        predictNextNumber(
            draws
        );


    const serverPrediction =
        data.wingo.prediction;


    // 优先采用 bot.py
    const finalPrediction =
        serverPrediction &&
        serverPrediction.size
            ? serverPrediction
            : prediction;


    // ========================================================
    // 预测颜色
    // ========================================================

    let confidenceHtml =
        "";


    if (
        finalPrediction.confidence ===
        "🔥高确信"
    ) {

        confidenceHtml = `
            <span style="
                font-size:0.75rem;
                color:#34d399;
                margin-left:4px;
            ">
                🔥高确信
            </span>
        `;

    } else if (
        finalPrediction.confidence ===
        "避险观望"
    ) {

        confidenceHtml = `
            <span style="
                font-size:0.75rem;
                color:#fbbf24;
                margin-left:4px;
            ">
                ⚠️避险观望
            </span>
        `;

    } else {

        confidenceHtml = `
            <span style="
                font-size:0.75rem;
                color:#94a3b8;
                margin-left:4px;
            ">
                普通
            </span>
        `;
    }


    document.getElementById(
        "predicted-result"
    ).innerHTML = `

        ${getNumberIconHtml(
            finalPrediction.num
        )}

        <span class="${
            finalPrediction.size === "大"
                ? "tag-big"
                : "tag-small"
        }">

            ${finalPrediction.size}

        </span>

        ${confidenceHtml}

        <span style="
            width:100%;
            font-size:0.72rem;
            color:#64748b;
            margin-top:4px;
        ">

            ${finalPrediction.signal}

            |

            大 ${
                finalPrediction.bigScore
                ?? prediction.bigScore
                ?? 0
            }

            :

            小 ${
                finalPrediction.smallScore
                ?? prediction.smallScore
                ?? 0
            }

        </span>
    `;


    // ========================================================
    // 历史回测
    // ========================================================

    let winCount = 0;

    let totalChecked = 0;

    let tableHtml = "";


    for (
        let i = 0;
        i < draws.length - 1;
        i++
    ) {

        const currentDraw =
            draws[i];


        const historySlice =
            draws.slice(
                i + 1
            );


        // 历史不足10期
        if (
            historySlice.length < 10
        ) {

            continue;
        }


        const prediction =
            predictNextNumber(
                historySlice
            );


        const isAvoid =
            prediction.signal ===
            "观望";


        const isWin =
            currentDraw.size ===
            prediction.size;


        // 只统计有实际方向的预测
        if (
            !isAvoid &&
            totalChecked < 20
        ) {

            totalChecked++;

            if (
                isWin
            ) {

                winCount++;
            }
        }


        let resultHtml = "";


        if (
            isAvoid
        ) {

            resultHtml = `
                <span style="
                    color:#fbbf24;
                    font-weight:bold;
                ">
                    ⚠️ 观望
                </span>
            `;

        } else if (
            isWin
        ) {

            resultHtml = `
                <span class="tag-win">
                    ✅ 赢
                </span>
            `;

        } else {

            resultHtml = `
                <span class="tag-loss">
                    ❌ 输
                </span>
            `;
        }


        tableHtml += `

            <tr>

                <td>
                    ${String(
                        currentDraw.issueNumber
                    ).slice(-4)}期
                </td>

                <td>

                    ${getNumberIconHtml(
                        currentDraw.number
                    )}

                    <span class="${
                        currentDraw.size === "大"
                            ? "tag-big"
                            : "tag-small"
                    }">

                        ${currentDraw.size}

                    </span>

                </td>

                <td>

                    ${getNumberIconHtml(
                        prediction.num
                    )}

                    <span class="${
                        prediction.size === "大"
                            ? "tag-big"
                            : "tag-small"
                    }">

                        ${prediction.size}

                    </span>

                </td>

                <td>
                    ${resultHtml}
                </td>

            </tr>
        `;
    }


    // ========================================================
    // 胜率
    // ========================================================

    const winRate =
        totalChecked > 0
            ? Math.round(
                (
                    winCount /
                    totalChecked
                ) * 100
            )
            : 0;


    document.getElementById(
        "win-rate"
    ).innerText =

        totalChecked > 0

            ? `${winRate}% (${winCount}赢 / ${
                totalChecked - winCount
              }输)`

            : "--";


    document.getElementById(
        "draw-table"
    ).innerHTML =
        tableHtml ||
        `
            <tr>
                <td colspan="4">
                    历史数据不足
                </td>
            </tr>
        `;


    // ========================================================
    // 图表
    // ========================================================

    renderWingoChart(
        [
            ...draws.slice(
                0,
                10
            )
        ].reverse()
    );
}


// ============================================================
// Baccarat
// ============================================================

async function refreshBaccaratDashboard() {

    if (
        currentMode !==
        "baccarat"
    ) {

        return;
    }


    const data =
        await loadData();


    if (
        !data ||
        !data.baccarat
    ) {

        return;
    }


    const baccarat =
        data.baccarat;


    const roomData =
        baccarat.rooms[
            currentRoom
        ] || [];


    if (
        roomData.length === 0
    ) {

        document.getElementById(
            "latest-issue"
        ).innerText =
            "--";


        document.getElementById(
            "latest-result"
        ).innerHTML =
            "--";


        document.getElementById(
            "predicted-result"
        ).innerHTML =
            "--";


        document.getElementById(
            "draw-table"
        ).innerHTML = `
            <tr>
                <td colspan="4">
                    ${currentRoom}
                    暂无实时数据
                </td>
            </tr>
        `;

        return;
    }


    const latest =
        roomData[0];


    document.getElementById(
        "latest-issue"
    ).innerText =
        `${latest.shoe}-${latest.game}`;


    document.getElementById(
        "latest-result"
    ).innerHTML =
        getBaccaratTag(
            latest.result
        );


    // ========================================================
    // Baccarat 当前预测
    // ========================================================

    const history =
        roomData;


    let nextPredict =
        "庄";


    if (
        history.length >= 5
    ) {

        const recent =
            history.slice(
                0,
                10
            );


        const banker =
            recent.filter(
                x =>
                    x.result === "庄"
            ).length;


        const player =
            recent.filter(
                x =>
                    x.result === "闲"
            ).length;


        if (
            banker >= 6
        ) {

            nextPredict =
                "闲";

        } else if (
            player >= 6
        ) {

            nextPredict =
                "庄";
        }
    }


    document.getElementById(
        "predicted-result"
    ).innerHTML = `

        ${getBaccaratTag(
            nextPredict
        )}

        <span style="
            font-size:0.75rem;
            color:#94a3b8;
            margin-left:4px;
        ">
            实时分析
        </span>
    `;


    // ========================================================
    // Baccarat 回测
    // ========================================================

    let winCount = 0;

    let totalChecked = 0;

    let tableHtml = "";


    for (
        let i = 0;
        i < roomData.length;
        i++
    ) {

        const item =
            roomData[i];


        const isWin =
            item.result ===
            item.predict;


        if (
            item.predict !==
            "和"
        ) {

            totalChecked++;

            if (
                isWin
            ) {

                winCount++;
            }
        }


        let resultHtml;


        if (
            item.result === "和"
        ) {

            resultHtml = `
                <span style="
                    color:#94a3b8;
                ">
                    退款
                </span>
            `;

        } else if (
            isWin
        ) {

            resultHtml = `
                <span class="tag-win">
                    ✅ 赢
                </span>
            `;

        } else {

            resultHtml = `
                <span class="tag-loss">
                    ❌ 输
                </span>
            `;
        }


        tableHtml += `

            <tr>

                <td>
                    ${item.shoe}-${item.game}
                </td>

                <td>
                    ${getBaccaratTag(
                        item.result
                    )}
                </td>

                <td>
                    ${getBaccaratTag(
                        item.predict
                    )}
                </td>

                <td>
                    ${resultHtml}
                </td>

            </tr>
        `;
    }


    const winRate =
        totalChecked > 0
            ? Math.round(
                (
                    winCount /
                    totalChecked
                ) * 100
            )
            : 0;


    document.getElementById(
        "win-rate"
    ).innerText =
        `${winRate}% (${winCount}赢 / ${
            totalChecked - winCount
        }输)`;


    document.getElementById(
        "draw-table"
    ).innerHTML =
        tableHtml;


    renderBaccaratChart(
        roomData
    );
}


// ============================================================
// Chart
// ============================================================

function renderWingoChart(
    recentDraws
) {

    if (
        myChart
    ) {

        myChart.destroy();
    }


    const ctx =
        document
            .getElementById(
                "chart-numbers"
            )
            .getContext(
                "2d"
            );


    myChart =
        new Chart(
            ctx,
            {

                type:
                    "line",

                data: {

                    labels:
                        recentDraws.map(
                            d =>
                                String(
                                    d.issueNumber
                                ).slice(-3)
                        ),

                    datasets: [

                        {

                            label:
                                "开奖号码",

                            data:
                                recentDraws.map(
                                    d =>
                                        d.number
                                ),

                            borderColor:
                                "#3b82f6",

                            backgroundColor:
                                "rgba(59,130,246,0.1)",

                            fill:
                                true,

                            tension:
                                0.3
                        }
                    ]
                },

                options: {

                    responsive:
                        true,

                    scales: {

                        y: {

                            min:
                                0,

                            max:
                                9,

                            grid: {

                                color:
                                    "#334155"
                            }
                        },

                        x: {

                            grid: {

                                color:
                                    "#334155"
                            }
                        }
                    },

                    plugins: {

                        legend: {

                            display:
                                false
                        }
                    }
                }
            }
        );
}


// ============================================================
// Baccarat Chart
// ============================================================

function renderBaccaratChart(
    roomData
) {

    if (
        myChart
    ) {

        myChart.destroy();
    }


    const bankerCnt =
        roomData.filter(
            d =>
                d.result === "庄"
        ).length;


    const playerCnt =
        roomData.filter(
            d =>
                d.result === "闲"
        ).length;


    const tieCnt =
        roomData.filter(
            d =>
                d.result === "和"
        ).length;


    const ctx =
        document
            .getElementById(
                "chart-numbers"
            )
            .getContext(
                "2d"
            );


    myChart =
        new Chart(
            ctx,
            {

                type:
                    "bar",

                data: {

                    labels:
                        [
                            "庄",
                            "闲",
                            "和"
                        ],

                    datasets: [

                        {

                            label:
                                "开奖次数",

                            data:
                                [
                                    bankerCnt,
                                    playerCnt,
                                    tieCnt
                                ],

                            backgroundColor:
                                [
                                    "#dc2626",
                                    "#2563eb",
                                    "#16a34a"
                                ]
                        }
                    ]
                },

                options: {

                    responsive:
                        true,

                    scales: {

                        y: {

                            beginAtZero:
                                true,

                            grid: {

                                color:
                                    "#334155"
                            }
                        },

                        x: {

                            grid: {

                                color:
                                    "#334155"
                            }
                        }
                    },

                    plugins: {

                        legend: {

                            display:
                                false
                        }
                    }
                }
            }
        );
}


// ============================================================
// Mode
// ============================================================

function switchGameMode(
    mode
) {

    currentMode =
        mode;


    document
        .getElementById(
            "btn-wingo"
        )
        .classList.toggle(
            "active",
            mode === "wingo"
        );


    document
        .getElementById(
            "btn-baccarat"
        )
        .classList.toggle(
            "active",
            mode === "baccarat"
        );


    const roomBar =
        document.getElementById(
            "baccarat-room-bar"
        );


    if (
        mode === "wingo"
    ) {

        roomBar.style.display =
            "none";


        document.getElementById(
            "page-title"
        ).innerText =
            "🎯 WinGo 预测胜率 Dashboard";


        document.getElementById(
            "card-label-issue"
        ).innerText =
            "最新期号";


        document.getElementById(
            "th-issue"
        ).innerText =
            "期号";


        document.getElementById(
            "chart-title"
        ).innerText =
            "📈 走势图";


        refreshDashboard();


    } else {

        roomBar.style.display =
            "flex";


        document.getElementById(
            "page-title"
        ).innerText =
            "🃏百家乐 Choice 实时监控";


        document.getElementById(
            "card-label-issue"
        ).innerText =
            "靴号-局号";


        document.getElementById(
            "th-issue"
        ).innerText =
            "靴-局";


        document.getElementById(
            "chart-title"
        ).innerText =
            "📈庄闲和分布图";


        refreshBaccaratDashboard();
    }
}


// ============================================================
// Room
// ============================================================

function changeBaccaratRoom() {

    currentRoom =
        document.getElementById(
            "room-select"
        ).value;


    refreshBaccaratDashboard();
}


// ============================================================
// Auto refresh
// ============================================================

setInterval(
    async () => {

        countdownVal--;

        if (
            countdownVal <= 0
        ) {

            countdownVal = 5;

            if (
                currentMode ===
                "wingo"
            ) {

                await refreshDashboard();

            } else {

                await refreshBaccaratDashboard();
            }
        }


        document.getElementById(
            "countdown"
        ).innerText =
            `${countdownVal}s`;

    },
    1000
);


// ============================================================
// Start
// ============================================================

refreshDashboard();

</script>
