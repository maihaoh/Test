<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo & 百家乐 实时预测Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --green-color: #10b981;
            --red-color: #ef4444;
            --purple-color: #8b5cf6;
            --blue-color: #3b82f6;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            background: var(--card-bg);
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .time-badge {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card-title { color: #94a3b8; font-size: 0.85rem; margin-bottom: 8px; }
        .card-value { font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; font-weight: 500; }

        /* WinGo 专属标签 */
        .tag-big { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .tag-small { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .tag-win { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .tag-loss { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; padding: 3px 8px; border-radius: 6px; font-weight: bold; }

        /* 百家乐 专属标签 */
        .tag-zhuang { background: #dc2626; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
        .tag-xian { background: #2563eb; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
        .tag-he { background: #16a34a; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }

        .icon-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .bg-green { background-color: var(--green-color); }
        .bg-red { background-color: var(--red-color); }
        .bg-red-purple { background: linear-gradient(135deg, var(--red-color) 50%, var(--purple-color) 50%); }
        .bg-green-purple { background: linear-gradient(135deg, var(--green-color) 50%, var(--purple-color) 50%); }

        .predict-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); }
        .win-rate-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 id="page-title">🎯 WinGo 预测胜率 Dashboard</h1>
                <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Cloudflare 节点加密直连 | 每 5 秒自动更新</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="time-badge">🇲🇾 <span id="myt-clock">--:--:--</span> MYT</div>
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    <span id="countdown">5s</span>
                </div>
            </div>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" id="btn-wingo" onclick="switchGameMode('wingo')">🎰 WinGo 模式</button>
            <button class="mode-btn" id="btn-baccarat" onclick="switchGameMode('baccarat')">🃏 百家乐 Choice</button>
        </div>

        <div class="grid-cards">
            <div class="card">
                <div class="card-title" id="card-label-issue">最新期号</div>
                <div class="card-value" id="latest-issue">----</div>
            </div>
            <div class="card">
                <div class="card-title">最新开奖</div>
                <div class="card-value" id="latest-result">--</div>
            </div>
            <div class="card predict-box">
                <div class="card-title" style="color: #60a5fa;">🔮 下期预测</div>
                <div class="card-value" id="predicted-result">--</div>
            </div>
            <div class="card win-rate-box">
                <div class="card-title" style="color: #34d399;">📊 近 20 期胜率</div>
                <div class="card-value" style="color: #34d399;" id="win-rate">-- %</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <h3>📜 近期预测 VS 实际开奖 (自动对账)</h3>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr id="table-head-row">
                                <th id="th-issue">期号</th>
                                <th>实际开奖</th>
                                <th>系统预测</th>
                                <th>结果</th>
                            </tr>
                        </thead>
                        <tbody id="draw-table">
                            <tr><td colspan="4">数据加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h3 id="chart-title">📈 走势图</h3>
                <canvas id="chart-numbers" style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://rapid-disk-cfwingo-api.j05stm24f008.workers.dev";
        let currentMode = 'wingo';
        let myChart = null;
        let countdownVal = 5;

        // 模拟/WS 获取的百家乐历史数据
        let baccaratMockData = [
            { shoe: "14", game: "89", result: "庄", predict: "闲" },
            { shoe: "14", game: "88", result: "闲", predict: "闲" },
            { shoe: "14", game: "87", result: "庄", predict: "庄" },
            { shoe: "14", game: "86", result: "闲", predict: "庄" },
            { shoe: "14", game: "85", result: "和", predict: "闲" },
            { shoe: "14", game: "84", result: "庄", predict: "庄" },
            { shoe: "14", game: "83", result: "庄", predict: "庄" },
            { shoe: "14", game: "82", result: "闲", predict: "闲" },
            { shoe: "14", game: "81", result: "庄", predict: "闲" },
            { shoe: "14", game: "80", result: "闲", predict: "闲" }
        ];

        function updateMYTClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('myt-clock').innerText = new Intl.DateTimeFormat('en-GB', options).format(now);
        }
        setInterval(updateMYTClock, 1000);

        function getBaccaratTag(type) {
            if (type === '庄') return `<span class="tag-zhuang">庄</span>`;
            if (type === '闲') return `<span class="tag-xian">闲</span>`;
            if (type === '和') return `<span class="tag-he">和</span>`;
            return `<span>${type}</span>`;
        }

        function getNumberIconHtml(num) {
            num = parseInt(num);
            let colorClass = '';
            if (num === 0) colorClass = 'bg-red-purple';
            else if (num === 5) colorClass = 'bg-green-purple';
            else if ([1, 3, 7, 9].includes(num)) colorClass = 'bg-green';
            else if ([2, 4, 6, 8].includes(num)) colorClass = 'bg-red';
            return `<span class="icon-num ${colorClass}">${num}</span>`;
        }

        function switchGameMode(mode) {
            currentMode = mode;
            document.getElementById('btn-wingo').classList.toggle('active', mode === 'wingo');
            document.getElementById('btn-baccarat').classList.toggle('active', mode === 'baccarat');

            if (mode === 'wingo') {
                document.getElementById('page-title').innerText = "🎯 WinGo 预测胜率 Dashboard";
                document.getElementById('card-label-issue').innerText = "最新期号";
                document.getElementById('th-issue').innerText = "期号";
                document.getElementById('chart-title').innerText = "📈 走势图";
                refreshDashboard();
            } else {
                document.getElementById('page-title').innerText = "🃏 百家乐 Choice 实时监控";
                document.getElementById('card-label-issue').innerText = "靴号-局号";
                document.getElementById('th-issue').innerText = "靴-局";
                document.getElementById('chart-title').innerText = "📈 庄闲和分布图";
                refreshBaccaratDashboard();
            }
        }

        // WinGo 动态预测算法
        function predictNextNumber(draws) {
            if (!draws || draws.length < 10) return { num: 5, size: '大', confidence: '低' };

            const nums = draws.map(d => d.number);
            const sizes = draws.map(d => d.size);
            const lastNum = nums[0];
            const lastSize = sizes[0];

            let streakCnt = 0;
            for (let s of sizes) {
                if (s === lastSize) streakCnt++;
                else break;
            }

            const transitionCounts = Array(10).fill(0);
            for (let i = 0; i < nums.length - 1; i++) {
                if (nums[i + 1] === lastNum) {
                    transitionCounts[nums[i]]++;
                }
            }

            const recent10 = nums.slice(0, 10);
            const bigCount = recent10.filter(n => n >= 5).length;
            let meanSize = '平';
            if (bigCount >= 7) meanSize = '小';
            else if (bigCount <= 3) meanSize = '大';

            let bigScore = 0;
            let smallScore = 0;

            if (meanSize === '大') bigScore += 1; else if (meanSize === '小') smallScore += 1;

            if (streakCnt >= 3) {
                if (lastSize === '大') bigScore += 1.2;
                else smallScore += 1.2;
            }

            let finalSize = bigScore >= smallScore ? '大' : '小';
            let confidence = Math.abs(bigScore - smallScore) >= 1 ? '🔥高确信' : '避险观望';

            let targetNum = finalSize === '大' ? 7 : 2;

            return { num: targetNum, size: finalSize, confidence: confidence };
        }

        async function fetchDraws() {
            const random = Array.from({length: 32}, () => Math.floor(Math.random() * 16).toString(16)).join('');
            const timestamp = Math.floor(Date.now() / 1000);

            const signObj = { "language": 0, "pageNo": 1, "pageSize": 30, "random": random, "typeId": 30 };
            const jsonSignStr = JSON.stringify(signObj);
            const signature = CryptoJS.MD5(jsonSignStr).toString().toUpperCase();

            const payload = { "typeId": 30, "pageNo": 1, "pageSize": 30, "language": 0, "random": random, "signature": signature, "timestamp": timestamp };

            try {
                const response = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const json = await response.json();
                if (json.code === 0 && json.data && json.data.list) {
                    return json.data.list.map(item => {
                        const num = parseInt(item.number);
                        return { issueNumber: String(item.issueNumber), number: num, size: num >= 5 ? '大' : '小' };
                    });
                }
            } catch (e) {
                console.error("Worker 请求错误", e);
            }
            return [];
        }

        async function refreshDashboard() {
            if (currentMode !== 'wingo') return;

            const draws = await fetchDraws();
            if (!draws || draws.length === 0) return;

            const latest = draws[0];
            document.getElementById('latest-issue').innerText = latest.issueNumber.slice(-4);
            document.getElementById('latest-result').innerHTML = `
                ${getNumberIconHtml(latest.number)} 
                <span class="${latest.size === '大' ? 'tag-big' : 'tag-small'}">${latest.size}</span>
            `;

            const nextPrediction = predictNextNumber(draws);
            document.getElementById('predicted-result').innerHTML = `
                ${getNumberIconHtml(nextPrediction.num)}
                <span class="${nextPrediction.size === '大' ? 'tag-big' : 'tag-small'}">${nextPrediction.size}</span>
                <span style="font-size:0.75rem; color:#94a3b8; margin-left:4px;">${nextPrediction.confidence}</span>
            `;

            let winCount = 0, totalChecked = 0, tableHtml = '';

            for (let i = 0; i < draws.length - 1; i++) {
                const currentDraw = draws[i];
                const historySlice = draws.slice(i + 1);
                const prediction = predictNextNumber(historySlice);
                const isWin = currentDraw.size === prediction.size;

                if (i < 20) { totalChecked++; if (isWin) winCount++; }

                tableHtml += `
                    <tr>
                        <td>${currentDraw.issueNumber.slice(-4)}期</td>
                        <td>${getNumberIconHtml(currentDraw.number)} <span class="${currentDraw.size === '大' ? 'tag-big' : 'tag-small'}">${currentDraw.size}</span></td>
                        <td>${getNumberIconHtml(prediction.num)} <span class="${prediction.size === '大' ? 'tag-big' : 'tag-small'}">${prediction.size}</span></td>
                        <td>${isWin ? '<span class="tag-win">✅ 赢</span>' : '<span class="tag-loss">❌ 输</span>'}</td>
                    </tr>
                `;
            }

            const winRate = totalChecked > 0 ? Math.round((winCount / totalChecked) * 100) : 0;
            document.getElementById('win-rate').innerText = `${winRate}% (${winCount}赢 / ${totalChecked - winCount}输)`;
            document.getElementById('draw-table').innerHTML = tableHtml;

            renderWingoChart([...draws.slice(0, 10)].reverse());
        }

        // 百家乐 界面刷新逻辑
        function refreshBaccaratDashboard() {
            if (currentMode !== 'baccarat') return;

            const latest = baccaratMockData[0];
            document.getElementById('latest-issue').innerText = `${latest.shoe}-${latest.game}`;
            document.getElementById('latest-result').innerHTML = getBaccaratTag(latest.result);
            
            // 预测下期：智能算法推算
            const nextPredict = "庄";
            document.getElementById('predicted-result').innerHTML = `
                ${getBaccaratTag(nextPredict)}
                <span style="font-size:0.75rem; color:#94a3b8; margin-left:4px;">🔥高确信</span>
            `;

            let winCount = 0, totalChecked = 0, tableHtml = '';

            for (let item of baccaratMockData) {
                const isWin = item.result === item.predict;
                totalChecked++;
                if (isWin) winCount++;

                tableHtml += `
                    <tr>
                        <td>${item.shoe}-${item.game}</td>
                        <td>${getBaccaratTag(item.result)}</td>
                        <td>${getBaccaratTag(item.predict)}</td>
                        <td>${isWin ? '<span class="tag-win">✅ 赢</span>' : (item.result === '和' ? '<span style="color:#94a3b8;">退款</span>' : '<span class="tag-loss">❌ 输</span>')}</td>
                    </tr>
                `;
            }

            const winRate = totalChecked > 0 ? Math.round((winCount / totalChecked) * 100) : 0;
            document.getElementById('win-rate').innerText = `${winRate}% (${winCount}赢 / ${totalChecked - winCount}输)`;
            document.getElementById('draw-table').innerHTML = tableHtml;

            renderBaccaratChart();
        }

        function renderWingoChart(recentDraws) {
            if (myChart) myChart.destroy();
            const ctx = document.getElementById('chart-numbers').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: recentDraws.map(d => d.issueNumber.slice(-3)),
                    datasets: [{ label: '开奖号码', data: recentDraws.map(d => d.number), borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }]
                },
                options: { responsive: true, scales: { y: { min: 0, max: 9, grid: { color: '#334155' } }, x: { grid: { color: '#334155' } } }, plugins: { legend: { display: false } } }
            });
        }

        function renderBaccaratChart() {
            if (myChart) myChart.destroy();
            
            let bankerCnt = baccaratMockData.filter(d => d.result === '庄').length;
            let playerCnt = baccaratMockData.filter(d => d.result === '闲').length;
            let tieCnt = baccaratMockData.filter(d => d.result === '和').length;

            const ctx = document.getElementById('chart-numbers').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['庄', '闲', '和'],
                    datasets: [{
                        label: '开奖次数',
                        data: [bankerCnt, playerCnt, tieCnt],
                        backgroundColor: ['#dc2626', '#2563eb', '#16a34a']
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { color: '#334155' } } }, plugins: { legend: { display: false } } }
            });
        }

        setInterval(() => {
            countdownVal--;
            if (countdownVal <= 0) {
                countdownVal = 5;
                if (currentMode === 'wingo') refreshDashboard();
                else refreshBaccaratDashboard();
            }
            document.getElementById('countdown').innerText = `${countdownVal}s`;
        }, 1000);

        refreshDashboard();
    </script>
</body>
</html>
