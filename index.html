<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo 实时预测 & 胜率监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --green-color: #10b981;
            --red-color: #ef4444;
            --purple-color: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; }

        .time-badge {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card-title { color: #94a3b8; font-size: 0.85rem; margin-bottom: 8px; }
        .card-value { font-size: 1.6rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; font-weight: 500; }

        .tag-big { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-small { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-win { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .tag-loss { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; padding: 3px 8px; border-radius: 6px; font-weight: bold; }

        .icon-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .bg-green { background-color: var(--green-color); }
        .bg-red { background-color: var(--red-color); }
        .bg-red-purple { background: linear-gradient(135deg, var(--red-color) 50%, var(--purple-color) 50%); }
        .bg-green-purple { background: linear-gradient(135deg, var(--green-color) 50%, var(--purple-color) 50%); }

        .predict-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); }
        .win-rate-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🎯 WinGo 预测胜率 Dashboard</h1>
                <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Cloudflare 节点加密直连 | 每 5 秒自动更新</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="time-badge">🇲🇾 <span id="myt-clock">--:--:--</span> MYT</div>
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    <span id="countdown">5s</span>
                </div>
            </div>
        </header>

        <div class="grid-cards">
            <div class="card">
                <div class="card-title">最新期号</div>
                <div class="card-value" id="latest-issue">----</div>
            </div>
            <div class="card">
                <div class="card-title">最新开奖</div>
                <div class="card-value" id="latest-result">--</div>
            </div>
            <div class="card predict-box">
                <div class="card-title" style="color: #60a5fa;">🔮 下期预测</div>
                <div class="card-value" id="predicted-result">--</div>
            </div>
            <div class="card win-rate-box">
                <div class="card-title" style="color: #34d399;">📊 近 20 期胜率</div>
                <div class="card-value" style="color: #34d399;" id="win-rate">-- %</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <h3>📜 近期预测 VS 实际开奖 (自动对账)</h3>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>期号</th>
                                <th>实际开奖</th>
                                <th>系统预测</th>
                                <th>结果</th>
                            </tr>
                        </thead>
                        <tbody id="draw-table">
                            <tr><td colspan="4">数据加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h3>📈 走势图</h3>
                <canvas id="chart-numbers" style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://rapid-disk-cfwingo-api.j05stm24f008.workers.dev";

        let myChart = null;
        let countdownVal = 5;

        function updateMYTClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('myt-clock').innerText = new Intl.DateTimeFormat('en-GB', options).format(now);
        }
        setInterval(updateMYTClock, 1000);

        function getNumberIconHtml(num) {
            num = parseInt(num);
            let colorClass = '';
            if (num === 0) colorClass = 'bg-red-purple';
            else if (num === 5) colorClass = 'bg-green-purple';
            else if ([1, 3, 7, 9].includes(num)) colorClass = 'bg-green';
            else if ([2, 4, 6, 8].includes(num)) colorClass = 'bg-red';
            return `<span class="icon-num ${colorClass}">${num}</span>`;
        }

        function getPredictionForDraw(historyDraws) {
            if (!historyDraws || historyDraws.length < 3) return { num: 5, size: '大' };
            const recent = historyDraws.slice(0, 5).map(d => d.number);
            const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
            const predictedSize = avg < 4.5 ? '大' : '小';
            const predictedNum = predictedSize === '大' ? Math.floor(avg + 2) % 10 : Math.floor(avg) % 5;
            return { num: predictedNum, size: predictedSize };
        }

        async function fetchDraws() {
            const random = Array.from({length: 32}, () => Math.floor(Math.random() * 16).toString(16)).join('');
            const timestamp = Math.floor(Date.now() / 1000);

            // 严格对齐官方签名对象结构 (按 Key 升序排版序列化 JSON)
            const signObj = {
                "language": 0,
                "pageNo": 1,
                "pageSize": 30,
                "random": random,
                "typeId": 30
            };
            const jsonSignStr = JSON.stringify(signObj);
            const signature = CryptoJS.MD5(jsonSignStr).toString().toUpperCase();

            const payload = {
                "typeId": 30,
                "pageNo": 1,
                "pageSize": 30,
                "language": 0,
                "random": random,
                "signature": signature,
                "timestamp": timestamp
            };

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await response.json();
                if (json.code === 0 && json.data && json.data.list) {
                    return json.data.list.map(item => {
                        const num = parseInt(item.number);
                        return {
                            issueNumber: String(item.issueNumber),
                            number: num,
                            size: num >= 5 ? '大' : '小',
                            colour: item.colour
                        };
                    });
                }
            } catch (e) {
                console.error("Worker 请求解析失败", e);
            }
            return [];
        }

        async function refreshDashboard() {
            const draws = await fetchDraws();
            if (!draws || draws.length === 0) return;

            const latest = draws[0];
            document.getElementById('latest-issue').innerText = latest.issueNumber.slice(-4);
            document.getElementById('latest-result').innerHTML = `
                ${getNumberIconHtml(latest.number)} 
                <span class="${latest.size === '大' ? 'tag-big' : 'tag-small'}">${latest.size}</span>
            `;

            const nextPrediction = getPredictionForDraw(draws);
            document.getElementById('predicted-result').innerHTML = `
                ${getNumberIconHtml(nextPrediction.num)}
                <span class="${nextPrediction.size === '大' ? 'tag-big' : 'tag-small'}">${nextPrediction.size}</span>
            `;

            let winCount = 0;
            let totalChecked = 0;
            let tableHtml = '';

            for (let i = 0; i < draws.length - 1; i++) {
                const currentDraw = draws[i];
                const historySlice = draws.slice(i + 1);
                const prediction = getPredictionForDraw(historySlice);
                const isWin = currentDraw.size === prediction.size;

                if (i < 20) {
                    totalChecked++;
                    if (isWin) winCount++;
                }

                tableHtml += `
                    <tr>
                        <td>${currentDraw.issueNumber.slice(-4)}期</td>
                        <td>
                            ${getNumberIconHtml(currentDraw.number)}
                            <span class="${currentDraw.size === '大' ? 'tag-big' : 'tag-small'}">${currentDraw.size}</span>
                        </td>
                        <td>
                            ${getNumberIconHtml(prediction.num)}
                            <span class="${prediction.size === '大' ? 'tag-big' : 'tag-small'}">${prediction.size}</span>
                        </td>
                        <td>
                            ${isWin ? '<span class="tag-win">✅ 赢</span>' : '<span class="tag-loss">❌ 输</span>'}
                        </td>
                    </tr>
                `;
            }

            const winRate = totalChecked > 0 ? Math.round((winCount / totalChecked) * 100) : 0;
            document.getElementById('win-rate').innerText = `${winRate}% (${winCount}赢 / ${totalChecked - winCount}输)`;
            document.getElementById('draw-table').innerHTML = tableHtml;

            const recentDraws = [...draws.slice(0, 10)].reverse();
            if (myChart) myChart.destroy();
            const ctx = document.getElementById('chart-numbers').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: recentDraws.map(d => d.issueNumber.slice(-3)),
                    datasets: [{
                        label: '开奖号码',
                        data: recentDraws.map(d => d.number),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { min: 0, max: 9, grid: { color: '#334155' } }, x: { grid: { color: '#334155' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        setInterval(() => {
            countdownVal--;
            if (countdownVal <= 0) {
                countdownVal = 5;
                refreshDashboard();
            }
            document.getElementById('countdown').innerText = `${countdownVal}s`;
        }, 1000);

        refreshDashboard();
        // 4. 极致加强版：多指标共振与动态过滤算法
function predictNextNumber(draws) {
    if (!draws || draws.length < 10) return { num: 5, signal: '观望', confidence: '低' };

    const nums = draws.map(d => d.number);
    const sizes = draws.map(d => d.size);
    const lastNum = nums[0];
    const lastSize = sizes[0];

    // --- 指标 1：长龙监测 (检测当前是否处于长龙) ---
    let streakCnt = 0;
    for (let s of sizes) {
        if (s === lastSize) streakCnt++;
        else break;
    }

    // --- 指标 2：马尔可夫转移概率 (历史跟号) ---
    const transitionCounts = Array(10).fill(0);
    for (let i = 0; i < nums.length - 1; i++) {
        if (nums[i + 1] === lastNum) {
            transitionCounts[nums[i]]++;
        }
    }
    const markovBestNum = transitionCounts.indexOf(Math.max(...transitionCounts));
    const markovSize = markovBestNum >= 5 ? '大' : '小';

    // --- 指标 3：近10期均值回归 (极值纠偏) ---
    const recent10 = nums.slice(0, 10);
    const bigCount = recent10.filter(n => n >= 5).length;
    let meanSize = '平';
    if (bigCount >= 7) meanSize = '小';      // 近10期大太频繁，拉回看小
    else if (bigCount <= 3) meanSize = '大';  // 近10期小太频繁，拉回看大

    // --- 指标 4：0与5特殊号反转因子 ---
    const isSpecialNum = (lastNum === 0 || lastNum === 5);

    // --- 综合共振打分 ---
    let bigScore = 0;
    let smallScore = 0;

    if (markovSize === '大') bigScore += 1.5; else smallScore += 1.5;
    if (meanSize === '大') bigScore += 1; else if (meanSize === '小') smallScore += 1;

    // 顺应长龙加分（长龙不盲目断龙）
    if (streakCnt >= 3) {
        if (lastSize === '大') bigScore += 1.2;
        else smallScore += 1.2;
    }

    // 确定最终预测方向与确信度
    let finalSize = '大';
    let confidence = '普通';
    
    if (Math.abs(bigScore - smallScore) < 0.8 || isSpecialNum) {
        confidence = '避险观望'; // 指标冲突或遇到0/5特殊号，建议不出手
    } else if (bigScore > smallScore) {
        finalSize = '大';
        confidence = bigScore >= 2.5 ? '🔥高确信' : '普通';
    } else {
        finalSize = '小';
        confidence = smallScore >= 2.5 ? '🔥高确信' : '普通';
    }

    // 根据最终大小选出评分最高的具体数字
    let targetNum = finalSize === '大' ? 7 : 2; // 默认中位数
    let maxNumScore = -1;
    for (let i = (finalSize === '大' ? 5 : 0); i < (finalSize === '大' ? 10 : 5); i++) {
        if (transitionCounts[i] > maxNumScore) {
            maxNumScore = transitionCounts[i];
            targetNum = i;
        }
    }

    return {
        num: targetNum,
        size: finalSize,
        confidence: confidence
    };
}
    </script>
</body>
</html>
