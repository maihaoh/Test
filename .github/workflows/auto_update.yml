        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          google-chrome --version || chromium --version || true

      - name: Verify required secrets
        shell: bash
        run: |
          missing=0
          for key in MZPLAY_USERNAME MZPLAY_PASSWORD MZPLAY_DEVICE_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured in GitHub Actions Secrets/Variables"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run collector and publish data.json every 5 minutes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python -u bot.py > bot.log 2>&1 &
          BOT_PID=$!
          echo "Collector PID: $BOT_PID"

          cleanup() {
            kill -INT "$BOT_PID" 2>/dev/null || true
            wait "$BOT_PID" 2>/dev/null || true
            echo "----- Last collector log lines -----"
            tail -n 120 bot.log || true
          }
          trap cleanup EXIT

          # First publish after 1 minute so a manual run shows data quickly.
          # Then publish every 5 minutes.
          # 1 + (46 x 5) = 231 minutes, leaving time before the 240-minute cap.
          for i in $(seq 1 47); do
            if [ "$i" -eq 1 ]; then
              sleep 60
            else
              sleep 300
            fi

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "::error::Collector stopped unexpectedly"
              tail -n 160 bot.log || true
              exit 1
            fi

            python -m json.tool data.json > /dev/null

            git add data.json

            if git diff --cached --quiet; then
              echo "[$i/47] No data change"
              continue
            fi

            git commit -m "Auto update data.json"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "[$i/47] data.json published"
          done
