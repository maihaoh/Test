name: Auto Fetch WinGo Data

on:
  schedule:
    # 每 5 分钟自动运行一次（GitHub Actions 允许的最高频率）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v3

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 运行单次抓取脚本
        run: |
          python run_once.py

      - name: 5. 自动提交 data.json 到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update data.json [skip ci]" && git push)
