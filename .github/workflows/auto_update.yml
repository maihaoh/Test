name: Auto Update Dashboard

on:
  schedule:
    # Keep one runner/session alive for almost 4 hours.
    # This avoids logging in to MZPLAY every 5 minutes.
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: dashboard-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MZPLAY_USERNAME: ${{ secrets.MZPLAY_USERNAME }}
      MZPLAY_PASSWORD: ${{ secrets.MZPLAY_PASSWORD }}
      MZPLAY_DEVICE_ID: ${{ vars.MZPLAY_DEVICE_ID || secrets.MZPLAY_DEVICE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          google-chrome --version || chromium --version || true

      - name: Verify required secrets
        shell: bash
        run: |
          missing=0
          for key in MZPLAY_USERNAME MZPLAY_PASSWORD MZPLAY_DEVICE_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured in GitHub Actions Secrets/Variables"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run collector and publish data.json every 1 minute
        shell: bash
        run: |
          set -euo pipefail

          python -u bot.py > bot.log 2>&1 &
          BOT_PID=$!
          echo "Collector PID: $BOT_PID"

          cleanup() {
            kill -INT "$BOT_PID" 2>/dev/null || true
            wait "$BOT_PID" 2>/dev/null || true
            tail -n 120 bot.log || true
          }
          trap cleanup EXIT

          # 235 x 1 minute = 3h55m. The workflow itself is capped at 4h.
          for i in $(seq 1 235); do
            sleep 60

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "::error::Collector stopped unexpectedly"
              tail -n 160 bot.log || true
              exit 1
            fi

            python -m json.tool data.json > /dev/null

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json

            if git diff --cached --quiet; then
              echo "[$i/235] No data change"
              continue
            fi

            git commit -m "Auto update data.json"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "[$i/235] data.json published"
          done
