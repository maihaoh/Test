services:
  - type: web
    name: test-realtime
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: bash ./render_build.sh
    startCommand: bash ./start_render.sh
    envVars:
      - key: MZPLAY_USERNAME
        sync: false
      - key: MZPLAY_PASSWORD
        sync: false
      - key: MZPLAY_DEVICE_ID
        sync: false
      - key: MZPLAY_AUTH_STATE_B64
        sync: false
      - key: INGEST_SECRET
        sync: false
      - key: DASHBOARD_ORIGIN
        value: https://maihaoh.github.io
      - key: CHOICE_MANUAL_ONLY
        value: "1"
      # V32: Choice is read-only and independent of the manual baccarat page.
      # It reuses the shared MZPlay session and follows the official game launch.
      - key: CHOICE_AUTO_ENABLED
        value: "1"
      - key: MULTI_GAMES_ENABLED
        value: "1"
      - key: MULTI_POLL_SECONDS
        value: "12"
