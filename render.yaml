services:
  - type: web
    name: test-realtime
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    buildCommand: bash ./render_build.sh
    startCommand: bash ./start_render.sh
    envVars:
      - key: MZPLAY_USERNAME
        sync: false
      - key: MZPLAY_PASSWORD
        sync: false
      - key: MZPLAY_DEVICE_ID
        sync: false
      - key: MZPLAY_AUTH_STATE_B64
        sync: false
      - key: INGEST_SECRET
        sync: false
      - key: DASHBOARD_ORIGIN
        value: https://maihaoh.github.io
      - key: CHOICE_HEADLESS
        value: "1"
